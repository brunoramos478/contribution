services:
  mysql:
    image: mysql:latest
    container_name: issue_test
    ports:
      - "3490:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: admin
      MYSQL_USER: test
      MYSQL_DATABASE: app

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "database", "database123"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mysql_data: